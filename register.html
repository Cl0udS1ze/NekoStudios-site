<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Create a NekoStudios account.">
<meta name="theme-color" content="#07090f">
<title>Register — NekoStudios</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
<script src="js/site.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/site-settings.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/auth-pages.js" defer></script>
</head>
<body data-page="auth" data-auth-page="register">
<a class="skip-link" href="#content">Skip to content</a>
<div data-site-header data-active="none" data-base="index.html"></div>
<main id="content">
  <section class="auth-page"><div class="container">
    <div class="auth-card">
      <p class="eyebrow">Join the studio</p>
      <h1>Create account</h1>
      <p class="page-support">Username: 3–24 characters. Password: at least 10 characters.</p>
      <label class="auth-field"><span>Username</span>
        <input id="reg-username" type="text" autocomplete="username" required></label>
      <label class="auth-field"><span>Email</span>
        <input id="reg-email" type="email" autocomplete="email" required></label>
      <label class="auth-field"><span>Password</span>
        <input id="reg-password" type="password" autocomplete="new-password" required></label>
      <div class="auth-error" id="auth-error" role="alert"></div>
      <button type="button" class="btn btn--primary auth-submit" id="reg-submit">Create account</button>
      <a class="auth-link" href="login.html">Already have an account? Log in</a>
    </div>
  </div></section>
</main>
<div data-site-footer data-active="none" data-base="index.html"></div>
</body>
</html>
