<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Создать аккаунт NekoStudios.">
<meta name="theme-color" content="#07090f">
<title>Регистрация — NekoStudios</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
<script src="js/site.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/site-settings.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/auth-pages.js" defer></script>
</head>
<body data-page="auth" data-auth-page="register">
<a class="skip-link" href="#content" data-i18n="skip">Перейти к содержимому</a>
<div data-site-header data-active="account" data-base="index.html"></div>
<main id="content">
  <section class="auth-page"><div class="container">
    <div class="auth-card">
      <p class="eyebrow" data-i18n="register_eyebrow">Присоединиться к студии</p>
      <h1 data-i18n="create_account">Создать аккаунт</h1>
      <p class="page-support" data-i18n="register_support">Имя пользователя: 3–24 символа. Пароль: не менее 10 символов.</p>
      <label class="auth-field"><span data-i18n="username">Имя пользователя</span>
        <input id="reg-username" type="text" autocomplete="username" required></label>
      <label class="auth-field"><span data-i18n="email">Email</span>
        <input id="reg-email" type="email" autocomplete="email" required></label>
      <label class="auth-field"><span data-i18n="password">Пароль</span>
        <input id="reg-password" type="password" autocomplete="new-password" required></label>
      <div class="auth-error" id="auth-error" role="alert"></div>
      <button type="button" class="btn btn--primary auth-submit" id="reg-submit" data-i18n="register_submit">Создать аккаунт</button>
      <a class="auth-link" href="login.html" data-i18n="have_account">Уже есть аккаунт? Войти</a>
    </div>
  </div></section>
</main>
<div data-site-footer data-active="account" data-base="index.html"></div>
</body>
</html>
