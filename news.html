<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Новости и devlog NekoStudios — новости студии, обновления проектов и заметки о разработке.">
<meta name="theme-color" content="#07090f">
<title>Новости и devlog — NekoStudios</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/news.css">
<script src="js/site.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/site-settings.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/news-data.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/repository.js" defer></script>
<script src="js/components.js" defer></script>
<script src="js/news-components.js" defer></script>
<script src="js/news.js" defer></script>
</head>
<body data-page="news">
<a class="skip-link" href="#content" data-i18n="skip">Перейти к содержимому</a>

<div data-site-header data-active="news" data-base="index.html"></div>

<main id="content">
  <section class="page-hero" aria-labelledby="news-title">
    <div class="container">
      <p class="eyebrow" data-i18n="news_eyebrow">Журнал</p>
      <h1 id="news-title" data-i18n="news_title">Новости и devlog</h1>
      <p class="page-subtitle" data-i18n="news_subtitle">Новости студии, обновления проектов и заметки о процессе разработки NekoStudios.</p>
      <p class="page-support" data-i18n="news_support">Черновики-демонстрации помечены как таковые и не являются официальными анонсами.</p>
    </div>
  </section>

  <section class="section catalog" id="news-section" aria-label="Publications" data-i18n-aria="news_section_label">
    <div class="container">
      <div class="news-intro">
        <div class="filter-bar" id="news-filters" role="group" aria-label="Filter publications" data-i18n-aria="filter_news_label">
          <button type="button" class="filter-btn is-active" data-category="all" aria-pressed="true" data-i18n="news_filter_all">Все новости</button>
          <button type="button" class="filter-btn" data-category="studio" aria-pressed="false" data-i18n="news_filter_studio">Новости студии</button>
          <button type="button" class="filter-btn" data-category="games" aria-pressed="false" data-i18n="news_filter_games">Обновления игр</button>
          <button type="button" class="filter-btn" data-category="software" aria-pressed="false" data-i18n="news_filter_software">Софт</button>
          <button type="button" class="filter-btn" data-category="devlog" aria-pressed="false" data-i18n="news_filter_devlog">Devlog</button>
        </div>
        <label class="search-field">
          <span class="sr-only" data-i18n="news_search">Поиск публикаций</span>
          <input id="news-search" type="search" placeholder="Поиск публикаций" autocomplete="off" data-i18n-placeholder="news_search">
        </label>
      </div>

      <div id="news-featured" class="news-featured"></div>
      <div id="news-grid" class="news-grid"></div>
      <div id="news-empty" class="empty-state" hidden></div>
      <noscript><p class="notice" data-i18n="news_js_notice">Включите JavaScript, чтобы увидеть публикации.</p></noscript>
    </div>
  </section>
</main>

<div data-site-footer data-active="news" data-base="index.html"></div>
</body>
</html>
