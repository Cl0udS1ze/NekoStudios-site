<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="News and devlog from NekoStudios — studio news, project updates and development notes.">
<meta name="theme-color" content="#07090f">
<title>News &amp; Devlog — NekoStudios</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/news.css">
<script src="js/site.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/site-settings.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/news-data.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/repository.js" defer></script>
<script src="js/components.js" defer></script>
<script src="js/news-components.js" defer></script>
<script src="js/news.js" defer></script>
</head>
<body data-page="news">
<a class="skip-link" href="#content">Skip to content</a>

<div data-site-header data-active="news" data-base="index.html"></div>

<main id="content">
  <section class="page-hero" aria-labelledby="news-title">
    <div class="container">
      <p class="eyebrow">Journal</p>
      <h1 id="news-title">News &amp; Devlog</h1>
      <p class="page-subtitle">Новости студии, обновления проектов и заметки о процессе разработки NekoStudios.</p>
      <p class="page-support">Demonstration drafts are marked as such and are not official announcements.</p>
    </div>
  </section>

  <section class="section catalog" id="news-section" aria-label="Publications">
    <div class="container">
      <div class="news-intro">
        <div class="filter-bar" id="news-filters" role="group" aria-label="Filter publications">
          <button type="button" class="filter-btn is-active" data-category="all" aria-pressed="true">All News</button>
          <button type="button" class="filter-btn" data-category="studio" aria-pressed="false">Studio News</button>
          <button type="button" class="filter-btn" data-category="games" aria-pressed="false">Game Updates</button>
          <button type="button" class="filter-btn" data-category="software" aria-pressed="false">Software</button>
          <button type="button" class="filter-btn" data-category="devlog" aria-pressed="false">Devlog</button>
        </div>
        <label class="search-field">
          <span class="sr-only">Search publications</span>
          <input id="news-search" type="search" placeholder="Search publications" autocomplete="off">
        </label>
      </div>

      <div id="news-featured" class="news-featured"></div>
      <div id="news-grid" class="news-grid"></div>
      <div id="news-empty" class="empty-state" hidden></div>
      <noscript><p class="notice">Enable JavaScript to view publications.</p></noscript>
    </div>
  </section>
</main>

<div data-site-footer data-active="news" data-base="index.html"></div>
</body>
</html>
